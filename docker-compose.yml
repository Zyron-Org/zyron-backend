version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: zyron-postgres
    environment:
      POSTGRES_USER: zyron
      POSTGRES_PASSWORD: zyron_secret_password
      POSTGRES_DB: zyron_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zyron -d zyron_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: zyron-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
